name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create and publish (vMAJOR.MINOR.PATCH, optionally -suffix for a prerelease)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Tag on a tag-push; the manual input on a workflow_dispatch run.
  REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    outputs:
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag and classify release
        id: kind
        run: |
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag '$REF_NAME' must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - name: Test
        run: make test

      - name: Build universal binary
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BINPATH="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          mkdir -p dist
          cp "$BINPATH/xcrashlytics" dist/xcrashlytics
          strip dist/xcrashlytics
          # strip invalidates the linker signature; re-sign every slice ad-hoc.
          codesign -s - -f dist/xcrashlytics
          codesign --verify --verbose dist/xcrashlytics
          # One arch per call: newer lipo rejects several archs in one -verify_arch.
          for arch in arm64 x86_64; do lipo dist/xcrashlytics -verify_arch "$arch"; done

      - name: Check version matches tag
        run: |
          BUILT="$(dist/xcrashlytics --version)"
          if [ "$BUILT" != "${REF_NAME#v}" ]; then
            echo "::error::binary reports '$BUILT' but the tag is '$REF_NAME'. Update the version in XcrashlyticsCommand.swift first."
            exit 1
          fi

      - name: Package + checksum
        run: |
          cd dist
          TARBALL="xcrashlytics-${REF_NAME}-macos-universal.tar.gz"
          tar -czf "$TARBALL" xcrashlytics
          shasum -a 256 "$TARBALL" | tee "$TARBALL.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$REF_NAME" \
            dist/*.tar.gz dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "$REF_NAME" \
            --generate-notes \
            ${FLAGS[@]+"${FLAGS[@]}"}

  # Stable releases only: a prerelease must never become the Homebrew version.
  formula:
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Update Homebrew formula
        run: |
          VERSION="${REF_NAME#v}"
          TARBALL="xcrashlytics-${REF_NAME}-macos-universal.tar.gz"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${REF_NAME}/${TARBALL}"
          curl -fsSL "$URL" -o "$TARBALL"
          SHA="$(shasum -a 256 "$TARBALL" | awk '{print $1}')"
          sed -i '' -E "s/  version \".*\"/  version \"${VERSION}\"/" Formula/xcrashlytics.rb
          sed -i '' -E "s/  sha256 \".*\"/  sha256 \"${SHA}\"/" Formula/xcrashlytics.rb
          grep -qx "  version \"${VERSION}\"" Formula/xcrashlytics.rb
          grep -qx "  sha256 \"${SHA}\"" Formula/xcrashlytics.rb
          cat Formula/xcrashlytics.rb

      - name: Commit formula
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/xcrashlytics.rb; then
            echo "Formula already up to date."
            exit 0
          fi
          git add Formula/xcrashlytics.rb
          git commit -m "chore: update Homebrew formula for ${REF_NAME}"
          if ! git push origin main; then
            VERSION="${REF_NAME#v}"
            SHA="$(grep -E '^  sha256 ' Formula/xcrashlytics.rb | sed -E 's/.*"(.*)"/\1/')"
            echo "::error title=Homebrew formula not updated::The release ${REF_NAME} is published, but pushing the formula to main failed (branch protection?). Set version \"${VERSION}\" and sha256 \"${SHA}\" in Formula/xcrashlytics.rb by hand."
            exit 1
          fi
